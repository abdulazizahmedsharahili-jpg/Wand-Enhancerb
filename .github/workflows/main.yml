name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web-panel if present
        shell: pwsh
        run: |
          if (Test-Path "web-panel/package.json") {
            corepack enable
            corepack prepare pnpm@latest --activate
            Push-Location web-panel
            pnpm install --no-frozen-lockfile
            pnpm run build
            Pop-Location
          }

      - name: Restore NuGet packages (packages.config + PackageReference)
        shell: pwsh
        run: |
          $nugetExe = "$env:RUNNER_TEMP\nuget.exe"
          Invoke-WebRequest -Uri "https://dist.nuget.org/win-x86-commandline/latest/nuget.exe" -OutFile $nugetExe
          & $nugetExe restore Wand-Enhancer.sln -PackagesDirectory packages -NonInteractive
          dotnet restore Wand-Enhancer.sln

      - name: Prepare WandEnhancer project files
        shell: pwsh
        run: |
          $csprojPath = "WandEnhancer/WandEnhancer.csproj"
          $projDir = "WandEnhancer"
          if (Test-Path $csprojPath) {
            [xml]$xml = Get-Content $csprojPath
            $changed = $false

            # 1) Fix missing or moved .cs includes
            $compileNodes = @($xml.SelectNodes("//*[local-name()='Compile' and @Include]"))
            foreach ($node in $compileNodes) {
              $inc = $node.GetAttribute("Include")
              if ($inc -match "\.cs$") {
                $relPath = $inc -replace '[\\/]', [System.IO.Path]::DirectorySeparatorChar
                $fullPath = Join-Path $projDir $relPath
                if (-not (Test-Path $fullPath)) {
                  $leafName = Split-Path $relPath -Leaf
                  $found = Get-ChildItem -Path $projDir -Recurse -Filter $leafName -File -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($found) {
                    $newRel = [System.IO.Path]::GetRelativePath((Resolve-Path $projDir).Path, $found.FullName) -replace '/', '\'
                    $node.SetAttribute("Include", $newRel)
                    $changed = $true
                  } else {
                    $parent = $node.ParentNode
                    $parent.RemoveChild($node) | Out-Null
                    $changed = $true
                  }
                }
              }
            }

            # 2) Ensure EnhancerConfig exists if referenced by codebase
            $enhancerConfigFile = Join-Path $projDir "EnhancerConfig.Fallback.cs"
            $hasEnhancerConfigSource = Get-ChildItem -Path $projDir -Recurse -Filter "*.cs" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -ne (Resolve-Path $enhancerConfigFile -ErrorAction SilentlyContinue)?.Path } |
              Select-String -Pattern "class\s+EnhancerConfig\b" -Quiet

            if (-not $hasEnhancerConfigSource) {
              $fallbackCode = @"
using System;
using System.Collections.Generic;

namespace WandEnhancer
{
    public class EnhancerConfig
    {
        public bool EnablePatch { get; set; } = true;
        public bool EnableLogging { get; set; } = false;
        public string TargetPath { get; set; } = string.Empty;
        public Dictionary<string, object> Options { get; set; } = new Dictionary<string, object>();
    }
}
"@
              Set-Content -Path $enhancerConfigFile -Value $fallbackCode -Encoding UTF8

              $hasFallbackInclude = $xml.SelectNodes("//*[local-name()='Compile' and @Include]") |
                Where-Object { $_.GetAttribute("Include") -eq "EnhancerConfig.Fallback.cs" }
              if (-not $hasFallbackInclude) {
                $ig = $xml.CreateElement("ItemGroup")
                $comp = $xml.CreateElement("Compile")
                $comp.SetAttribute("Include", "EnhancerConfig.Fallback.cs")
                $ig.AppendChild($comp) | Out-Null
                $xml.Project.AppendChild($ig) | Out-Null
                $changed = $true
              }
            }

            if ($changed) {
              $xml.Save((Resolve-Path $csprojPath).Path)
            }
          }

      - name: Build Solution
        shell: pwsh
        run: |
          msbuild Wand-Enhancer.sln /p:Configuration=Release /m

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Windows-Release
          path: |
            **/bin/Release/**/*.exe
            **/bin/Release/**/publish/**
