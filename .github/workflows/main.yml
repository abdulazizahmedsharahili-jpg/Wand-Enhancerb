name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web-panel if present
        shell: pwsh
        run: |
          if (Test-Path "web-panel/package.json") {
            corepack enable
            corepack prepare pnpm@latest --activate
            Push-Location web-panel
            pnpm install --frozen-lockfile
            pnpm run build
            Pop-Location
          }

      - name: Restore and Build Solution
        shell: pwsh
        run: |
          dotnet restore Wand-Enhancer.sln
          dotnet build Wand-Enhancer.sln -c Release

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Windows-Release
          path: |
            **/bin/Release/**/*.exe
            **/bin/Release/**/publish/**
