name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build web-panel if present
        shell: pwsh
        run: |
          if (Test-Path "web-panel/package.json") {
            corepack enable
            corepack prepare pnpm@latest --activate
            Push-Location web-panel
            pnpm install --no-frozen-lockfile
            pnpm run build
            Pop-Location
          }

      - name: Ensure Newtonsoft.Json is referenced in AsarSharp
        shell: pwsh
        run: |
          $csproj = "AsarSharp/AsarSharp.csproj"
          if (Test-Path $csproj) {
            [xml]$xml = Get-Content $csproj
            $hasNewtonsoft = $xml.SelectNodes("//PackageReference") | Where-Object { $_.Include -eq "Newtonsoft.Json" }
            if (-not $hasNewtonsoft) {
              $itemGroup = $xml.Project.ItemGroup | Select-Object -First 1
              if (-not $itemGroup) {
                $itemGroup = $xml.CreateElement("ItemGroup")
                $xml.Project.AppendChild($itemGroup) | Out-Null
              }
              $pkg = $xml.CreateElement("PackageReference")
              $pkg.SetAttribute("Include", "Newtonsoft.Json")
              $pkg.SetAttribute("Version", "13.0.3")
              $itemGroup.AppendChild($pkg) | Out-Null
              $xml.Save((Resolve-Path $csproj).Path)
            }
          }

      - name: Restore and Build Solution
        shell: pwsh
        run: |
          dotnet restore Wand-Enhancer.sln --force
          dotnet build Wand-Enhancer.sln -c Release --no-restore

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer-Windows-Release
          path: |
            **/bin/Release/**/*.exe
            **/bin/Release/**/publish/**
